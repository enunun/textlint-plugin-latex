[tools]
rtk = "0.49.0"
lefthook = "2.1.14"
node = "26.10.0"
pnpm = "12.6.0"
# 版を固定する場合はここで`mise lock`を実行し，生成されたmise.lockもコミットする．

[tasks.install]
description = "依存パッケージをインストールする(lib/へのビルドも行う)"
run = "pnpm install --frozen-lockfile"

[tasks.build]
description = "src/をlib/へビルドする"
depends = ["install"]
run = "pnpm run build"

[tasks.typecheck]
description = "型検査を行う"
depends = ["install"]
run = "pnpm run typecheck"

[tasks."lint:docs"]
description = "Markdownの文書をtextlintとmarkdownlintで検査する"
depends = ["install"]
run = "pnpm lint"

[tasks.lint]
description = "すべてのリントを実行する"
depends = ["typecheck", "lint:docs"]

[tasks.test]
description = "単体テストを実行する"
depends = ["install"]
run = "pnpm test"

[tasks.hooks]
description = "Gitのフック(コミット時の検査)を設定する"
run = "lefthook install"

[tasks.setup]
description = "開発環境を整える(依存パッケージ，Gitのフックなど)"
depends = ["install", "hooks"]

[tasks.check]
description = "リント，単体テスト，ビルドをまとめて実行する(CIと同じ)"
depends = ["lint", "test", "build"]
